# ===================================================================
# ResolveIT Grievance Management System - Sample Configuration
# Copy this file to application-local.properties or set environment variables.
# NEVER commit real passwords, API tokens, or signing keys to Git.
# ===================================================================

# Application Configuration
spring.application.name=ResolveIT Grievance Management

# Server Port
server.port=8080

# Database Configuration (H2 in-memory default; or MySQL for production)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# For MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/grievance_db?useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your_db_username
# spring.datasource.password=your_db_password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# Required in production: 256-bit (32+ character) hex or base64 key
jwt.secret=YOUR_SECURE_HMAC_SHA256_SECRET_KEY_MIN_32_CHARS
jwt.expiration=86400000

# Google OAuth2 (for Google Sign-In)
google.oauth.client-id=YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com

# Email Configuration (for password reset and status notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Centralized CORS Configuration (Comma-separated allowed origins)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Seed Account Configuration (for local testing)
app.admin.password=YOUR_ADMIN_PASSWORD_OR_DEV_DEFAULT
app.seed.officer-password=YOUR_OFFICER_PASSWORD_OR_DEV_DEFAULT
