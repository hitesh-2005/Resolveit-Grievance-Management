# Application Configuration
spring.application.name=ResolveIT Grievance Management

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (Default: in-memory H2 for development/testing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Development only)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# Note: If JWT_SECRET is unset or blank, JwtUtils securely generates an ephemeral 256-bit key for local development.
# For production, set JWT_SECRET to a strong HMAC-SHA256 secret (minimum 256 bits / 32 characters).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth2 Client ID (Override with GOOGLE_OAUTH_CLIENT_ID in environment)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:your-google-client-id-here}

# Email Configuration (Override with environment variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Centralized CORS Configuration (Comma-separated allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Development Seed Account Security (Override in production or CI via environment variables)
app.admin.password=${ADMIN_PASSWORD:Admin@ResolveIT2026!}
app.seed.officer-password=${SEED_OFFICER_PASSWORD:Officer@ResolveIT2026!}
